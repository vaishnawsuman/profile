<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .Profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: lightgray;
            padding: 0px;
            border-radius: 0px;
            width: 300px;
            margin: 50px auto;
            border-width: 50px;
            border-color: rgb(134, 21, 21);

        }

        .Profile img {
            border-radius: 50px;
            margin-bottom: 25px;
        }

        .Profile h1 {
            margin: 0;
            font-size: 40px;
        }

        .profile h2 {
            margin: 5px 0;
            font-size: 20px;
            color: #333;
        }

        .Profile p {
            font-size: 16px;
            color: #555;
        }

        .Profile button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .Profile button:hover {
            background-color: #0056b3;
        }
    </style>
    <title>profile</title>
</head>

<body>
    <div class="Profile">
        <img src="https://i.pinimg.com/736x/69/82/f9/6982f9200aecff0b2a3a9c610edff02d.jpg" alt="Profile Picture"
            width="100" height="100">
        <h1>PROFILE</h1>
        <h2> Vaishnaw </h2>
        <p> full stack developer</p>

        <button>Follow </button>

    </div>

</body>

</html>
